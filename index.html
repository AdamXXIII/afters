<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>AFTERS</title>
  <meta name="description" content="A party game for after dinner. Everyone plays on their phone." />
  <meta name="theme-color" content="#3B1F18" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AFTERS" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <style>
    /* boot paint before CSS bundles load: warm, never white */
    html, body { background: #3B1F18; margin: 0; height: 100%; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; transition: opacity .4s; }
    #boot i { width: 14px; height: 26px; border-radius: 50% 50% 45% 45%; background: #FFC86B; box-shadow: 0 0 24px 8px rgba(255,184,102,.5); animation: bf 1.2s ease-in-out infinite; }
    @keyframes bf { 50% { transform: scale(1.1, 1.2) rotate(3deg); } }
    body.booted #boot { opacity: 0; pointer-events: none; }
  </style>
</head>
<body data-layout="show">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div id="fx" aria-hidden="true"></div>
  <main id="app">
    <section id="show" aria-live="polite"></section>
    <div id="bubbles"></div>
    <header id="strip"></header>
    <section id="sheet"><div id="sheet-body"></div></section>
    <nav id="rail" aria-label="Reactions"></nav>
    <div id="topbar"></div>
  </main>
  <div id="overlay"></div>
  <div id="toasts" aria-live="assertive"></div>
  <div id="boot" aria-hidden="true"><i></i></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
